name: npm Release

# Publishes @spec-ade/cli-switch (the JS launcher) plus one prebuilt-binary
# package per platform. Separate from release.yml, which builds the desktop
# bundles and is left untouched.

on:
  push:
    tags:
      - 'npm-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
            binary: server.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            pkg: win32-arm64
            binary: server.exe
          - os: macos-14
            target: x86_64-apple-darwin
            pkg: darwin-x64
            binary: server
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: darwin-arm64
            binary: server
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
            binary: server
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
            binary: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Tauri keeps its default `wry` feature enabled even under
      # `server-runtime`, so the headless binary still links WebKitGTK on Linux
      # and needs these at build time.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup LLVM for Windows ARM64
        if: matrix.pkg == 'win32-arm64'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build web frontend
        run: bun run build:web

      - name: Build server binary
        working-directory: src-tauri
        run: cargo build --release --bin server --features server-runtime --target ${{ matrix.target }}

      - name: Stage platform package
        shell: bash
        run: |
          set -euxo pipefail
          dest="npm/platforms/${{ matrix.pkg }}/bin"
          mkdir -p "$dest"
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dest/"
          # The server resolves `dist/` as a sibling of the executable.
          cp -r dist-web "$dest/dist"
          rm -f "$dest/.gitkeep"

      - name: Pack platform package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cd "npm/platforms/${{ matrix.pkg }}"
          npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Upload packed tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download platform tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          merge-multiple: true
          path: artifacts

      - name: Verify all six platform tarballs are present
        shell: bash
        run: |
          set -euxo pipefail
          count=$(ls artifacts/*.tgz | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "Expected 6 platform tarballs, found $count:" >&2
            ls -la artifacts >&2
            exit 1
          fi

      # Platform packages go first: the launcher lists them as
      # optionalDependencies at an exact version, so publishing it first would
      # leave a window where `npx` resolves a launcher whose binaries do not
      # exist yet.
      - name: Publish platform packages
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          for tarball in artifacts/*.tgz; do
            npm publish "$tarball" --access public --provenance
          done

      - name: Publish launcher
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: npm/cli-switch
        run: npm publish --access public --provenance

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        shell: bash
        run: |
          echo "Dry run — nothing published. Packed tarballs:"
          ls -la artifacts
